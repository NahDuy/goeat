<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hôm Nay Ăn Gì? - Pokemon Ed.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Mali Font for Cute/Handwritten look -->
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Extra styles for Auth/Group placeholders if not in style.css */
        #authContainer {
            position: absolute;
            top: 1rem;
            right: 1rem;
            z-index: 200;
            font-family: 'Mali', cursive;
        }

        #authContainer button {
            font-family: inherit;
            font-weight: 700;
        }

        #userDisplay {
            display: none;
            align-items: center;
            background: rgba(255, 255, 255, 0.8);
            padding: 5px 10px;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        #groupDashboard {
            display: none;
            margin-bottom: 2rem;
        }

        #groupLobby,
        #groupRoom {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            padding: 1.5rem;
            border: 2px dashed var(--pk-pink-dark);
        }

        #hostControls {
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            padding-top: 10px;
        }

        /* Modal Styles Overlay */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 2rem;
            border-radius: 30px;
            border: 4px solid var(--pk-pink-light);
            text-align: center;
            position: relative;
        }

        .close-auth {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 1.5rem;
            border: none;
            background: none;
            cursor: pointer;
            color: #aaa;
        }
    </style>
</head>

<body>
    <!-- Top Controls Wrapper -->
    <div class="top-controls">
        <button id="soundToggle" class="icon-btn sound-btn" title="Âm thanh">🔊</button>
        <button class="icon-btn settings-btn" title="Cài đặt">⚙️</button>
    </div>

    <div class="container">
        <header>
            <div id="authContainer">
                <button id="loginBtnTrigger" class="secondary-btn"
                    style="padding: 0.5rem 1rem; font-size: 0.8rem; background: var(--pk-blue);">Đăng nhập</button>
                <div id="userDisplay">
                    <span id="userNameDisplay" style="color: var(--pk-pink-dark); margin-right: 8px;">User</span>
                    <button id="myMenuBtn"
                        style="background:#00b894; color:white; border:none; padding:3px 8px; border-radius:10px; margin-right:5px; cursor:pointer;"
                        title="Sửa thực đơn">📝 Menu</button>
                    <button id="logoutBtn"
                        style="color: red; font-weight: bold; background:none; border:none; cursor:pointer;">Logout</button>
                </div>
            </div>

            <h1>Hôm Nay Ăn Gì?</h1>
            <p>Pika Pika! Chọn món siêu tốc!</p>
        </header>

        <!-- Filters -->
        <div class="filter-bar">
            <button class="filter-btn active" data-category="all">Tất cả</button>
            <button class="filter-btn" data-category="rice">Cơm</button>
            <button class="filter-btn" data-category="noodle">Bún/Phở</button>
            <button class="filter-btn" data-category="snack">Ăn vặt</button>
        </div>

        <main>
            <!-- GROUP MODE UI -->
            <div id="groupDashboard">
                <!-- Lobby -->
                <div id="groupLobby">
                    <h2 style="color: var(--pk-pink-dark); margin-bottom: 1rem;">Chế độ Ăn Nhóm</h2>

                    <div id="myGroupsList" style="margin-bottom: 1.5rem; max-height: 150px; overflow-y: auto;">
                        <!-- Groups will be injected here -->
                    </div>

                    <div class="action-buttons" style="flex-direction: column; gap: 10px;">
                        <button id="createGroupBtn" class="premium-btn">Tạo Phòng Mới</button>
                        <div style="display: flex; gap: 5px; justify-content: center;">
                            <input type="text" id="joinCodeInput" placeholder="Mã phòng (VD: X7A9)"
                                style="padding: 10px; border-radius: 15px; border: 2px solid #dfe6e9; width: 60%; text-align: center; font-weight: bold; text-transform: uppercase;">
                            <button id="joinGroupBtn" class="secondary-btn" style="padding: 0 1.5rem;">Vào</button>
                        </div>
                    </div>
                </div>

                <!-- Waiting Room -->
                <div id="groupRoom" style="display: none;">
                    <h3 style="color: #636e72;">Phòng: <span id="roomCodeDisplay"
                            style="font-size: 2.5rem; color: var(--pk-blue); font-weight: 800; display: block;">PENDING</span>
                    </h3>

                    <div class="pokedex-screen" style="margin: 1rem 0; text-align: left;">
                        <h4 style="margin-bottom: 5px;">Thành viên:</h4>
                        <ul id="memberList"
                            style="list-style: none; padding-left: 5px; max-height: 100px; overflow-y: auto;">
                            <!-- Members injected here -->
                        </ul>
                    </div>

                    <div id="votingSection">
                        <input type="text" id="dishVoteInput" placeholder="Bạn muốn ăn món gì?..."
                            style="width: 100%; padding: 12px; border-radius: 15px; border: 2px solid #dfe6e9; margin-bottom: 10px; outline: none;">
                        <button id="submitVoteBtn" class="premium-btn" style="width: 100%;">Gửi Đề Xuất</button>
                    </div>

                    <div id="hostControls" style="display: none; margin-top: 1rem;">
                        <button id="rollGroupBtn" class="premium-btn"
                            style="background: var(--pk-red); width: 100%; box-shadow: 0 5px 0 #d63031;">🎲 CHỐT ĐƠN
                            (Host)</button>
                    </div>

                    <div id="groupResult" style="display: none; margin-top: 1rem; animation: wobble 1s infinite;">
                        <h2 style="font-size: 1.2rem;">Hôm nay chúng ta ăn:</h2>
                        <div id="groupResultText"
                            style="color: var(--pk-red); font-size: 2.5rem; font-weight: 800; text-shadow: 2px 2px 0 white;">
                        </div>
                    </div>
                </div>
            </div>

            <!-- EXISTING SOLO MODES -->
            <div id="soloModes">
                <!-- Single Card Mode -->
                <div class="card-container" id="cardContainer">
                    <div class="card-inner">
                        <div class="card-front">
                            <!-- Pokeball CSS -->
                            <div class="card-front-inner"></div>
                        </div>
                        <!-- Face Up injected by JS -->
                        <div class="card-back"></div>
                    </div>
                </div>

                <!-- Hand (5 Cards) Mode -->
                <div class="hand-container" id="handContainer" style="display: none;">
                    <!-- 5 cards injected here -->
                </div>

                <div class="result-box">
                    <h2 id="dishName">Nhấn nút bên dưới!</h2>
                    <div class="dish-badge" id="dishBadge" style="opacity: 0;">Món ngon</div>
                </div>

                <div class="action-buttons">
                    <button id="randomBtn" class="premium-btn">Bốc 1 Món</button>
                    <button id="pick5Btn" class="secondary-btn">Bốc 5 Chọn 1</button>
                </div>

                <div style="margin-top: 15px;">
                    <button id="toggleGroupBtn" class="secondary-btn" style="background: #a29bfe; width: 100%;">👥
                        Chuyển sang Ăn Nhóm</button>
                </div>
            </div>
        </main>

        <!-- Pokedex History Panel -->
        <div class="history-panel">
            <div class="pokedex-header">
                <div class="led-blue"></div>
                <div class="led-small led-red"></div>
                <div class="led-small led-yellow"></div>
                <div class="led-small led-green"></div>
            </div>
            <div class="pokedex-screen">
                <h3>Nhật ký ăn uống</h3>
                <div id="historyList"></div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Login Modal (Trainer Card Style) -->
    <div id="authModal" class="modal">
        <!-- ... content ... -->
        <div class="modal-content">
            <div class="trainer-card-header">
                <h3 style="color:white; z-index:1; margin-bottom:5px;">Huấn Luyện Viên</h3>
                <button class="close-auth" style="color:white;">&times;</button>
            </div>
            <div class="trainer-card-body">
                <div class="auth-tabs">
                    <button class="auth-tab active" id="tabLogin">Đăng nhập</button>
                    <button class="auth-tab" id="tabRegister">Đăng ký</button>
                </div>

                <div class="auth-box">
                    <div class="auth-input-group">
                        <span class="auth-input-icon">👤</span>
                        <input type="text" id="authUsername" placeholder="Tên đăng nhập">
                    </div>
                    <div class="auth-input-group">
                        <span class="auth-input-icon">🔑</span>
                        <input type="password" id="authPassword" placeholder="Mật khẩu">
                    </div>
                    <button id="doAuthBtn" class="premium-btn" style="width:100%; margin-top:10px;">Đăng Nhập</button>
                </div>
            </div>
        </div>
    </div>

    <!-- My Menu Modal -->
    <div id="menuModal" class="modal">
        <div class="modal-content" style="height: 70vh;">
            <div class="modal-header"
                style="background:var(--pk-blue); padding:1rem; border-radius: 20px 20px 0 0; display:flex; justify-content:space-between; align-items:center;">
                <h3 style="color:white; margin:0;">Thực Đơn Của Tôi (52 Lá)</h3>
                <button onclick="document.getElementById('menuModal').style.display='none'"
                    style="background:none; border:none; color:white; font-size:1.5rem; cursor:pointer;">&times;</button>
            </div>
            <div class="modal-body" id="myDeckList" style="padding:1rem; overflow-y:auto; flex:1;">
                <!-- Items injected here -->
            </div>
        </div>
    </div>

    <!-- Audio Elements -->
    <audio id="shuffleSound" src="https://assets.mixkit.co/active_storage/sfx/2556/2556-preview.mp3"
        preload="auto"></audio>
    <audio id="revealSound" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3"
        preload="auto"></audio>

    <script src="script.js"></script>
</body>

<!-- Audio Elements -->
<audio id="shuffleSound" src="https://assets.mixkit.co/active_storage/sfx/2556/2556-preview.mp3" preload="auto"></audio>
<audio id="revealSound" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3" preload="auto"></audio>

<script src="script.js"></script>
</body>

</html>
